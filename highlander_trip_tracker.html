function appliesTo(a){if(a==='all')return[1,1,1];if(a==='shared')return[1,1,1];if(a==='ja')return[1,1,0];if(a==='j')return[1,0,0];if(a==='a')return[0,1,0];if(a==='k')return[0,0,1];return[1,1,1]}
function clCount(pfx,list){let t=0,d=0;list.forEach((item,i)=>{appliesTo(item.applies).forEach((y,p)=>{if(y){t++;if(checks[pfx+i+'-'+p])d++}})});return{total:t,done:d}}
function pfhCount(){let t=0,d=0;PFH.forEach(cat=>{cat.items.forEach((item,i)=>{appliesTo(item.applies).forEach((y,p)=>{if(y){t++;if(checks['pfh-'+cat.cat+'-'+i+'-'+p])d++}})})});return{total:t,done:d}}
function cbHTML(k,ok){if(!ok)return'<div class="cl-check-cell"><div class="cl-check na"></div></div>';const ck=checks[k]?' checked':'';return'<div class="cl-check-cell"><div class="cl-check'+ck+'" onclick="toggle(\''+k.replace(/'/g,"\\'")+'\')">'+'<span class="mark">✓</span></div></div>'}
function clHdr(){return'<div class="cl-header"><div class="cl-item-col">Item</div><div class="cl-person-col" style="color:var(--blue)">J</div><div class="cl-person-col" style="color:var(--purple)">A</div><div class="cl-person-col" style="color:var(--orange)">K</div></div>'}

function render(){
  // tabs
  const cl=clCount('cl-',CL),pf=pfhCount();
  let th='';
  TABS.forEach((t,i)=>{let l=esc(t);if(i===3)l+=' ('+cl.done+'/'+cl.total+')';if(i===4)l+=' ('+pf.done+'/'+pf.total+')';th+='<button class="tab-btn'+(i===activeTab?' active':'')+'" onclick="switchTab('+i+')">'+l+'</button>'});
  document.getElementById('tabBar').innerHTML=th;

  let h='';

  if(activeTab===0){
    h+='<p class="intro">Day-by-day travel timeline with driving distances. Trek days shown on-trail.</p>';
    TL.forEach(day=>{
      h+='<div class="tl-day"><div class="tl-day-header">📅 '+esc(day.date)+' — '+esc(day.label)+'</div>';
      day.items.forEach(it=>{
        if(it.type==='d'){h+='<div class="tl-drive">'+esc(it.text)+'</div>';return}
        h+='<div class="tl-card"><div class="tl-card-head"><div style="flex:1"><div class="tl-card-title">'+(it.icon||'')+' '+esc(it.title)+'</div><div class="tl-card-sub">'+esc(it.detail)+'</div></div>';
        if(it.who)h+='<div>'+whoBadge(it.who)+'</div>';
        h+='</div>';
        if(it.conf)h+='<div class="tl-card-conf">Conf: '+esc(it.conf)+'</div>';
        if(it.notes)h+='<div class="tl-card-notes">'+esc(it.notes)+'</div>';
        h+='</div>';
      });
      h+='</div>';
    });
  }

  if(activeTab===1){
    h+='<p class="intro">Gear ordered for Jonathan & Alan (returned items removed). Kevin\'s gear TBD.</p>';
    GEAR.forEach(cat=>{
      h+='<div class="gear-cat"><div class="gear-cat-header">'+esc(cat.name)+'</div>';
      cat.items.forEach(g=>{
        h+='<div class="gear-row"><div style="flex:1;min-width:0"><div>'+esc(g.item)+'</div>'+(g.note?'<div class="gear-note">'+esc(g.note)+'</div>':'')+'</div><div class="gear-right">'+whoBadge(g.who)+' <span class="gear-source">'+esc(g.source)+'</span> '+badge(g.status==='processing'?'yellow':'green',g.status)+'</div></div>';
      });
      h+='</div>';
    });
  }

  if(activeTab===2){
    h+='<div class="section-title">🏨 Lodging</div>';
    LODGING.forEach(l=>{
      h+='<div class="lcard"><div class="lcard-head"><div><div class="lcard-name">'+esc(l.name)+'</div><div class="lcard-room">'+esc(l.dates)+' · '+esc(l.room)+'</div></div><div style="text-align:right"><div class="lcard-cost mono">'+esc(l.cost)+'</div><div class="lcard-conf">Conf: '+esc(l.conf)+'</div></div></div>'+(l.who?'<div style="margin-top:4px">'+badge('green',l.who)+'</div>':'')+(l.checkin?'<div class="lcard-times">In '+esc(l.checkin)+' · Out '+esc(l.checkout)+'</div>':'')+'<div class="lcard-notes">'+esc(l.notes)+'</div></div>';
    });
    h+='<div class="section-title mt">✈️ 🚗 Transportation</div>';
    TRAV.forEach(t=>{
      h+='<div class="lcard"><div class="lcard-name">'+esc(t.type)+' '+esc(t.label)+'</div><div class="lcard-room">'+esc(t.date)+'</div><div style="font-size:13px;margin-top:5px">'+esc(t.detail)+'</div><div class="lcard-conf" style="margin-top:3px">Conf: '+esc(t.conf)+'</div><div class="lcard-notes">'+esc(t.notes)+'</div></div>';
    });
  }

  if(activeTab===3){
    h+='<p class="intro">Per-person checklist. Even shared items get a checkbox per person for confirmation.</p>';
    h+='<div class="badge-row">'+badge('green',cl.done+' checked')+' '+badge('gray',(cl.total-cl.done)+' remaining')+'</div>';
    h+=clHdr();
    h+='<div class="cl-cat-header mandatory">🔴 Mandatory Gear</div>';
    CL.forEach((g,i)=>{if(g.mandatory)h+=clRow('cl-',i,g,true)});
    h+='<div class="cl-cat-header normal" style="margin-top:16px">🟢 Recommended</div>';
    CL.forEach((g,i)=>{if(!g.mandatory)h+=clRow('cl-',i,g,false)});
  }

  if(activeTab===4){
    h+='<p class="intro">Items from home or to buy. One checkbox per person.</p>';
    h+='<div class="badge-row">'+badge('green',pf.done+' set aside')+' '+badge('gray',(pf.total-pf.done)+' remaining')+'</div>';
    h+=clHdr();
    PFH.forEach(cat=>{
      h+='<div class="cl-cat-header '+cat.type+'">'+esc(cat.cat)+'</div>';
      cat.items.forEach((g,i)=>{
        const pfx='pfh-'+cat.cat+'-',ap=appliesTo(g.applies);
        h+='<div class="cl-row"><div class="cl-item-col"><div class="cl-item-text">'+esc(g.item)+(g.applies==='shared'?' '+badge('gray','SHARED'):'')+'</div>'+(g.note?'<div class="cl-item-note">'+esc(g.note)+'</div>':'')+'</div>'+cbHTML(pfx+i+'-0',ap[0])+cbHTML(pfx+i+'-1',ap[1])+cbHTML(pfx+i+'-2',ap[2])+'</div>';
      });
    });
  }

  if(activeTab===5){
    h+='<p class="intro">Action items, open questions, and confirmed info.</p>';
    h+='<h3 class="sub-title warn">⚠️ Action Items</h3>';
    GAPS.filter(g=>g.type==='warn').forEach(g=>{h+='<div class="gap-warn">'+esc(g.text)+'</div>'});
    h+='<h3 class="sub-title blue mt">ℹ️ Confirmed Info</h3>';
    GAPS.filter(g=>g.type==='info').forEach(g=>{h+='<div class="gap-info">'+esc(g.text)+'</div>'});
  }

  document.getElementById('content').innerHTML=h;
}
function switchTab(i){activeTab=i;render()}
render();
</script>
