async function seedData() {
  log("Signing in with Google…", "info");
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    log("✓ Signed in as " + auth.currentUser.email);
    log("Writing tripdata to Firebase…", "info");
    await db.ref("hl2026/tripdata").set(TRIPDATA);
    log("✓ Timeline: " + TRIPDATA.timeline.length + " days written");
    log("✓ Lodging: " + TRIPDATA.lodging.length + " entries written");
    log("✓ Travel: " + TRIPDATA.travel.length + " entries written");
    log("\n✅ DONE. Delete this file from GitHub after seeding.", "ok");
  } catch(err) {
    log("✗ Error: " + err.message, "err");
  }
}
