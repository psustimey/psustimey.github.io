<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WeatherStory Widget</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{height:100%;margin:0}
    #weather-widget{display:flex;align-items:center;justify-content:center;height:100%;background:#000}
    #weatherImg{max-width:100%;max-height:100%;display:block}
    #error{color:#f88;font-family:monospace}
  </style>
</head>
<body>
  <div id="weather-widget">
    <img id="weatherImg" alt="WeatherStory" src="" />
  </div>
  <script>
    (function(){
      const CONFIG_PATH = './weatherstory.json';
      const MANIFEST_PATH = './weatherstory-manifest.json';
      const DEFAULT_POLL_INTERVAL_MS = 60 * 1000; // how often to refresh manifest
      const DEFAULT_DISPLAY_MS = 10 * 1000; // how long to show each image

      async function fetchJson(path){
        const res = await fetch(path, {cache:'no-store'});
        if(!res.ok) throw new Error('Failed to fetch ' + path + ': ' + res.status);
        return res.json();
      }

      async function loadConfig(){
        try{
          return await fetchJson(CONFIG_PATH);
        }catch(err){
          console.warn('Config load failed, using defaults', err);
          return { poll_interval_seconds: 60, display_duration_seconds: 10 };
        }
      }

      async function loadManifest(){
        try{
          return await fetchJson(MANIFEST_PATH);
        }catch(err){
          console.warn('Manifest load failed', err);
          return null;
        }
      }

      let urls = [];
      let manifestUpdatedAt = null;
      let currentIndex = 0;
      let displayMs = DEFAULT_DISPLAY_MS;
      let pollMs = DEFAULT_POLL_INTERVAL_MS;
      let displayTimer = null;
      let manifestTimer = null;

      function showImage(url){
        const img = document.getElementById('weatherImg');
        img.src = url + '?_=' + Date.now();
      }

      function startDisplayLoop(){
        if(displayTimer) clearInterval(displayTimer);
        if(!urls || urls.length === 0) return;
        // Ensure currentIndex is in range
        currentIndex = currentIndex % urls.length;
        showImage(urls[currentIndex]);
        displayTimer = setInterval(() => {
          currentIndex = (currentIndex + 1) % urls.length;
          showImage(urls[currentIndex]);
        }, displayMs);
      }

      async function refreshManifest(){
        try{
          const m = await loadManifest();
          if(!m) return;
          // Update display and poll intervals if provided
          if(m.updatedAt && m.updatedAt !== manifestUpdatedAt){
            manifestUpdatedAt = m.updatedAt;
            urls = Array.isArray(m.urls) ? m.urls.slice() : [];
            currentIndex = 0;
            startDisplayLoop();
            console.info('Manifest updated; cycling', urls.length, 'urls');
          } else if (!manifestUpdatedAt && Array.isArray(m.urls) && m.urls.length){
            // initial load
            manifestUpdatedAt = m.updatedAt || new Date().toISOString();
            urls = m.urls.slice();
            currentIndex = 0;
            startDisplayLoop();
          }
        }catch(err){
          console.warn('refreshManifest error', err);
        }
      }

      async function start(){
        const cfg = await loadConfig();
        if(cfg && Number.isFinite(cfg.poll_interval_seconds)){
          pollMs = Math.max(5000, cfg.poll_interval_seconds * 1000);
        }
        if(cfg && Number.isFinite(cfg.display_duration_seconds)){
          displayMs = Math.max(1000, cfg.display_duration_seconds * 1000);
        }

        await refreshManifest();
        // poll manifest periodically
        manifestTimer = setInterval(refreshManifest, pollMs);
      }

      // Start widget
      start();

      // Expose for debugging
      window.__weatherstory_widget = { start, refreshManifest, startDisplayLoop };
    })();
  </script>
</body>
</html>
