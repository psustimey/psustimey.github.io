name: Scheduled WeatherStory manifest update

on:
  push:
    branches: [ main ]
  schedule:
    # every 15 minutes
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Run weatherstory monitor to write manifest
        run: |
          python scripts/weatherstory_monitor.py --manifest-out public/weatherstory-manifest.json

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/weatherstory-manifest.json; then
            git add public/weatherstory-manifest.json
            git commit -m "Update weatherstory manifest [skip ci]"
            git push
          else
            echo "No manifest changes to commit"
          fi
