name: Scheduled WeatherStory manifest update

on:
  push:
    branches: [ main ]
  schedule:
    # every 15 minutes
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Run weatherstory monitor to write manifest
        run: |
          python scripts/weatherstory_monitor.py --manifest-out public/weatherstory-manifest.json

      - name: Upload manifest via GitHub API
        env:
          REPO: ${{ github.repository }}
          BRANCH: main
          FILEPATH: public/weatherstory-manifest.json
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Preparing to upload manifest $FILEPATH to $REPO on branch $BRANCH"
          if [ ! -f "$FILEPATH" ]; then
            echo "Manifest file not found; skipping upload"; exit 0
          fi
          API="https://api.github.com/repos/$REPO/contents/$FILEPATH"
          # Read remote file metadata to get sha if it exists

          REMOTE_JSON=$(curl -s -H "Authorization: ******" "$API?ref=$BRANCH" || true)
          SHA=$(echo "$REMOTE_JSON" | python3 -c "import sys, json; j=json.load(sys.stdin) if not sys.stdin.isatty() else {}; print(j.get(\"sha\") or \"\")") || true


          # Build payload and upload via API
                    # Build payload and upload via GitHub API (avoid heredoc Python block)
          CONTENT=$(python3 - <<PY
          
          main
import base64,sys
print(base64.b64encode(open("$FILEPATH","rb").read()).decode())
PY
)
          if [ -n "$SHA" ]; then
            PAYLOAD=$(printf '%s' "{\"message\": \"Update weatherstory manifest [skip ci]\", \"branch\": \"$BRANCH\", \"content\": \"$CONTENT\", \"sha\": \"$SHA\"}")
          else
            PAYLOAD=$(printf '%s' "{\"message\": \"Update weatherstory manifest [skip ci]\", \"branch\": \"$BRANCH\", \"content\": \"$CONTENT\"}")
          fi
          curl -s -X PUT -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD" "$API"
          echo "Upload step completed"

