name: Scheduled WeatherStory manifest update

on:
  push:
    branches: [ main ]
  schedule:
    # hourly
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Run weatherstory monitor to write manifest
        run: |
          python scripts/weatherstory_monitor.py --manifest-out public/weatherstory-manifest.json

      - name: Upload manifest via GitHub API
        env:
          REPO: ${{ github.repository }}
          BRANCH: main
          FILEPATH: public/weatherstory-manifest.json
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Preparing to upload manifest $FILEPATH to $REPO on branch $BRANCH"
          if [ ! -f "$FILEPATH" ]; then
            echo "Manifest file not found; skipping upload"; exit 0
          fi
          API="https://api.github.com/repos/$REPO/contents/$FILEPATH"

          # Read remote file metadata to get sha if it exists
          REMOTE_JSON=$(curl -s -H "Authorization: token $TOKEN" "$API?ref=$BRANCH" || true)
          SHA=$(echo "$REMOTE_JSON" | jq -r '.sha // ""' 2>/dev/null || true)

          # Build payload and upload via API using jq to avoid tricky escaping
          # get base64 content (portable across runners)
          if command -v base64 >/dev/null 2>&1; then
            CONTENT=$(base64 "$FILEPATH" 2>/dev/null | tr -d '\n')
          else
            CONTENT=$(python3 -c "import base64,sys;print(base64.b64encode(open('$FILEPATH','rb').read()).decode())")
          fi

          if [ -n "$SHA" ]; then
            jq -n --arg m "Update weatherstory manifest [skip ci]" --arg b "$BRANCH" --arg c "$CONTENT" --arg s "$SHA" '{message:$m, branch:$b, content:$c, sha:$s}' > /tmp/payload.json
          else
            jq -n --arg m "Update weatherstory manifest [skip ci]" --arg b "$BRANCH" --arg c "$CONTENT" '{message:$m, branch:$b, content:$c}' > /tmp/payload.json
          fi

          curl -s -X PUT -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/payload.json "$API"
          echo "Upload step completed"
          REMOTE_JSON=$(curl -s -H "Authorization: token $TOKEN" "$API?ref=$BRANCH" || true)
          SHA=$(echo "$REMOTE_JSON" | jq -r '.sha // ""' 2>/dev/null || true)

          # Build payload and upload via API using jq to avoid tricky escaping
          # get base64 content (portable across runners)
          if command -v base64 >/dev/null 2>&1; then
            # GNU coreutils base64 supports -w; fallback will strip newlines
            CONTENT=$(base64 "$FILEPATH" 2>/dev/null | tr -d '\n')
          else
            CONTENT=$(python3 -c "import base64,sys;print(base64.b64encode(open('$FILEPATH','rb').read()).decode())")
          fi

          if [ -n "$SHA" ]; then
            jq -n --arg m "Update weatherstory manifest [skip ci]" --arg b "$BRANCH" --arg c "$CONTENT" --arg s "$SHA" '{message:$m, branch:$b, content:$c, sha:$s}' > /tmp/payload.json
          else
            jq -n --arg m "Update weatherstory manifest [skip ci]" --arg b "$BRANCH" --arg c "$CONTENT" '{message:$m, branch:$b, content:$c}' > /tmp/payload.json
          fi

          curl -s -X PUT -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/payload.json "$API"
          echo "Upload step completed"

