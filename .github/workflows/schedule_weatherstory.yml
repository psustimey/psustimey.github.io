name: Scheduled WeatherStory manifest update

on:
  push:
    branches: [ main ]
  schedule:
    # every 15 minutes
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Run weatherstory monitor to write manifest
        run: |
          python scripts/weatherstory_monitor.py --manifest-out public/weatherstory-manifest.json

      - name: Upload manifest via GitHub API
        env:
          REPO: ${{ github.repository }}
          BRANCH: main
          FILEPATH: public/weatherstory-manifest.json
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Preparing to upload manifest $FILEPATH to $REPO on branch $BRANCH"
          if [ ! -f "$FILEPATH" ]; then
            echo "Manifest file not found; skipping upload"; exit 0
          fi
          API="https://api.github.com/repos/$REPO/contents/$FILEPATH"
          # Read remote file metadata to get sha if it exists
          REMOTE_JSON=$(curl -s -H "Authorization: ******" "$API?ref=$BRANCH" || true)
          SHA=$(echo "$REMOTE_JSON" | python3 -c "import sys, json; j=json.load(sys.stdin) if not sys.stdin.isatty() else {}; print(j.get(\"sha\") or \"\")") || true


          # Build payload and upload via API
          python3 - <<PY | curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @- "$API"
import json,base64,sys
p='$FILEPATH'
with open(p,'rb') as f:
    content = base64.b64encode(f.read()).decode()
payload = {
  'message': 'Update weatherstory manifest [skip ci]',
  'branch': '$BRANCH',
  'content': content
}
sha = '$SHA'
if sha:
    payload['sha'] = sha
print(json.dumps(payload))
PY
          echo "Upload step completed"
