name: Scheduled WeatherStory manifest update

on:
  push:
    branches: [ main ]
  schedule:
    # every 15 minutes
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Run weatherstory monitor to write manifest
        run: |
          python scripts/weatherstory_monitor.py --manifest-out public/weatherstory-manifest.json

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/weatherstory-manifest.json; then
            git add public/weatherstory-manifest.json
            git commit -m "Update weatherstory manifest [skip ci]" || true
            # Ensure we have latest remote main and rebase local change onto it to avoid non-fast-forward
            git fetch origin main --quiet
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin HEAD:main || echo "Push rejected (branch protection?)"
            else
              # Try to rebase local commit(s) onto origin/main; if this fails abort to avoid conflicts in runner
              if git rebase origin/main; then
                git push origin HEAD:main || echo "Push rejected after rebase (branch protection?)"
              else
                echo "Rebase failed; aborting push to avoid conflicts"
                git rebase --abort || true
              fi
            fi
          else
            echo "No manifest changes to commit"
          fi
