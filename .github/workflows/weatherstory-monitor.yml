name: WeatherStory Monitor

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: state
          key: weatherstory-monitor-state
          restore-keys: |
            weatherstory-monitor-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run WeatherStory monitor
        run: |
          mkdir -p state public
          python scripts/weatherstory_monitor.py \
            --state-file state/weatherstory_monitor_state.json \
            --webhook-url "${{ secrets.WEBHOOK_URL }}" \
            --manifest-out public/weatherstory.json \
            --verbose 2>&1 | tee state/weatherstory_monitor.out.log
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Save monitor state cache
        uses: actions/cache@v4
        with:
          path: state
          key: weatherstory-monitor-state
      - name: Upload run logs and state
        uses: actions/upload-artifact@v4
        with:
          name: weatherstory-monitor-state
          path: state
