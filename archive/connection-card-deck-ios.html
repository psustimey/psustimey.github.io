<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Card Deck">
<title>Connection Card Deck</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1814;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
select{font:inherit;color:inherit}

/* ── layout ── */
.app{max-width:640px;margin:0 auto;padding:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:8px}
.title{font-size:1.1rem;font-weight:700}
.subtitle{font-size:.75rem;color:#6b6860;margin-top:1px}
.theme-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #ddd;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}

/* ── mode grid ── */
.mode-section{margin-bottom:20px}
.section-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b6860;margin-bottom:8px}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-btn{padding:10px 6px;border-radius:12px;background:#fff;border:2px solid transparent;text-align:center;transition:border-color .15s,background .15s}
.mode-btn.active{border-color:#2a7a80;background:#eef8f8}
.mode-btn .icon{font-size:1.4rem;display:block;margin-bottom:3px}
.mode-btn .label{font-size:.7rem;font-weight:600;line-height:1.2}

/* ── controls bar ── */
.controls{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.controls select{flex:1;padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:.85rem}
.ctrl-btn{height:42px;padding:0 14px;border-radius:10px;background:#fff;border:1px solid #ddd;font-size:.82rem;font-weight:600;white-space:nowrap}
.ctrl-btn.primary{background:#2a7a80;color:#fff;border-color:#2a7a80}

/* ── card ── */
.card-wrap{position:relative;min-height:280px;margin-bottom:16px}
.card{position:absolute;inset:0;border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(140deg,#eef8f8,#fff);border:1px solid #d0e8e9;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;width:fit-content}
.badge.l1{background:#e8f4f5;color:#2a7a80}
.badge.l2{background:#fdf0e0;color:#c07010}
.badge.l3{background:#f0eafc;color:#6b3aaa}
.question{font-size:clamp(1.25rem,5vw,1.65rem);font-weight:700;line-height:1.2;flex:1;display:flex;align-items:center}
.hint{font-size:.78rem;color:#6b6860;margin-top:12px}
.card-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.card-actions button{height:38px;padding:0 14px;border-radius:10px;background:#fff;border:1px solid #ddd;font-size:.8rem;font-weight:600}
.card-actions .next-btn{background:#2a7a80;color:#fff;border-color:#2a7a80;margin-left:auto}

/* ── 3-card draw ── */
.draw3-panel{background:#fff;border:1px solid #d0e8e9;border-radius:16px;padding:16px;margin-bottom:16px;display:none}
.draw3-panel h3{font-size:.85rem;font-weight:700;margin-bottom:12px;color:#2a7a80}
.draw3-item{padding:10px 12px;border-radius:10px;background:#f5f4f0;margin-bottom:8px}
.draw3-item:last-child{margin-bottom:0}
.draw3-item .di-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b6860;margin-bottom:3px}
.draw3-item .di-text{font-size:.88rem;line-height:1.3}

/* ── progress ── */
.progress-row{display:flex;justify-content:space-between;font-size:.75rem;color:#6b6860;margin-bottom:6px}
.progress-bar{height:6px;background:#e0ddd8;border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;background:#2a7a80;border-radius:3px;transition:width .3s}

/* ── empty state ── */
.empty{text-align:center;padding:60px 20px;color:#6b6860}
.empty .big{font-size:2.5rem;margin-bottom:12px}

/* ── dark mode ── */
[data-theme=dark]{background:#111110;color:#e8e5df}
[data-theme=dark] .mode-btn,[data-theme=dark] .ctrl-btn,[data-theme=dark] .controls select,[data-theme=dark] .card-actions button,[data-theme=dark] .draw3-panel{background:#1e1d1b;border-color:#333}
[data-theme=dark] .mode-btn.active{background:#143535;border-color:#3a9aa0}
[data-theme=dark] .card{background:linear-gradient(140deg,#143535,#1e1d1b);border-color:#2a4a4a}
[data-theme=dark] .draw3-item{background:#111110}
[data-theme=dark] .progress-bar{background:#2a2926}
[data-theme=dark] .theme-btn{background:#1e1d1b;border-color:#333}
[data-theme=dark] .subtitle,[data-theme=dark] .section-label,[data-theme=dark] .hint,[data-theme=dark] .progress-row,[data-theme=dark] .empty,[data-theme=dark] .di-label{color:#a0a09a}
[data-theme=dark] .badge.l1{background:#143535;color:#6bc8ce}
[data-theme=dark] .badge.l2{background:#2a1e00;color:#e0a255}
[data-theme=dark] .badge.l3{background:#1e1535;color:#b890ee}
[data-theme=dark] .ctrl-btn.primary,[data-theme=dark] .card-actions .next-btn{background:#3a9aa0;border-color:#3a9aa0;color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="title">Connection Card Deck</div>
      <div class="subtitle" id="modeSubtitle">Pick a mode to begin</div>

  <div class="draw3-panel" id="draw3Panel">

  </div>

  <div class="progress-row">

    <span id="filterLabel">All levels</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="card-wrap" id="cardWrap">
    <div class="card">
      <div>
        <div class="badge l1">Ready</div>
        <div class="question">Choose a mode above to begin.</div>
      </div>
      <div class="hint">90 couples cards + 5 more modes — all saved in this file.</div>
    </div>
  </div>

  <div class="card-actions" id="cardActions" style="display:none">
    <button id="prevBtn">← Prev</button>
    <button id="copyBtn">Copy</button>
    <button id="removeBtn">Remove</button>
    <button class="next-btn" id="nextBtn">Next →</button>
  </div>
</div>

const state = {
  theme: window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light',
  mode: 'couples',
  filter: 'all',
  deck: [],
  index: 0,
  seen: new Set()
};

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getDeck() {
  return ALL_CARDS.filter(c =>
    c.mode === state.mode &&
    (state.filter === 'all' || String(c.level) === state.filter)
  );
}

function setTheme(t) {
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
}

function renderModes() {
  const g = $('modeGrid');
  g.innerHTML = '';
  Object.entries(MODES).forEach(([key, m]) => {
    const b = document.createElement('button');
    b.className = 'mode-btn' + (key === state.mode ? ' active' : '');
    b.innerHTML = '<span class="icon">' + m.icon + '</span><span class="label">' + m.title + '</span>';
    b.addEventListener('click', () => {
      state.mode = key;
      state.index = 0;
      state.seen.clear();
      $('draw3Panel').style.display = 'none';
      render();
    });
    g.appendChild(b);
  });
  $('modeSubtitle').textContent = MODES[state.mode].description;
}

function renderCard() {
  state.deck = getDeck();
  const wrap = $('cardWrap');
  const actions = $('cardActions');

  if (!state.deck.length) {
    wrap.innerHTML = '<div class="card"><div class="empty"><div class="big">🃏</div><div>No cards match this filter.</div></div></div>';
    actions.style.display = 'none';
    updateProgress();
    return;
  }

  if (state.index >= state.deck.length) state.index = 0;
  const card = state.deck[state.index];
  state.seen.add(card.theme + card.level + card.text);

  const levelLabels = {1:'Level 1 — Light', 2:'Level 2 — Reflective', 3:'Level 3 — Deep'};
  const hints = {
    1:'A lighter opener — ease in gently.',
    2:'One layer deeper — go here when the first feels warm.',
    3:'Use this when there is real space for depth.'
  };

  wrap.innerHTML =
    '<div class="card">' +
      '<div>' +
        '<div class="badge l' + card.level + '">' + card.theme + ' &middot; ' + levelLabels[card.level] + '</div>' +
        '<div class="question">' + card.text + '</div>' +
      '</div>' +
      '<div class="hint">' + hints[card.level] + '</div>' +
    '</div>';

  actions.style.display = 'flex';
  updateProgress();
}

function updateProgress() {
  const deck = getDeck();
  const reviewed = deck.filter(c => state.seen.has(c.theme + c.level + c.text)).length;
  const total = deck.length;
  const pct = total ? Math.round(reviewed / total * 100) : 0;
  $('progressLabel').textContent = reviewed + ' of ' + total + ' reviewed';
  $('progressFill').style.width = pct + '%';
  $('filterLabel').textContent = state.filter === 'all' ? 'All levels' : 'Level ' + state.filter + ' only';
}

function render() {
  renderModes();
  renderCard();
}

function drawThree() {
  const modeDeck = ALL_CARDS.filter(c => c.mode === state.mode);
  const picks = [1, 2, 3].map(lvl => {
    const opts = shuffle(modeDeck.filter(c => c.level === lvl));
    return opts[0] || null;
  }).filter(Boolean);

  const panel = $('draw3Panel');
  const list = $('draw3List');
  const levelLabels = {1:'Level 1 — Light', 2:'Level 2 — Reflective', 3:'Level 3 — Deep'};

  if (!picks.length) { panel.style.display = 'none'; return; }
  list.innerHTML = picks.map(c =>
    '<div class="draw3-item">' +
      '<div class="di-label">' + c.theme + ' &middot; ' + levelLabels[c.level] + '</div>' +
      '<div class="di-text">' + c.text + '</div>' +
    '</div>'
  ).join('');
  panel.style.display = 'block';
}

// ── events ──
$('themeBtn').addEventListener('click', () => setTheme(state.theme === 'dark' ? 'light' : 'dark'));
$('levelFilter').addEventListener('change', e => { state.filter = e.target.value; state.index = 0; render(); });
$('shuffleBtn').addEventListener('click', () => { state.deck = shuffle(getDeck()); state.index = 0; state.seen.clear(); render(); });
$('draw3Btn').addEventListener('click', drawThree);
$('nextBtn').addEventListener('click', () => { state.index = (state.index + 1) % (getDeck().length || 1); renderCard(); });
$('prevBtn').addEventListener('click', () => { const d = getDeck(); state.index = (state.index - 1 + d.length) % (d.length || 1); renderCard(); });
$('copyBtn').addEventListener('click', () => {
  const d = getDeck();
  if (!d.length) return;
  const c = d[state.index];
  navigator.clipboard?.writeText(c.text).catch(() => {});
});
$('removeBtn').addEventListener('click', () => {
  const d = getDeck();
  if (!d.length) return;
  const c = d[state.index];
  const idx = ALL_CARDS.findIndex(x => x.mode===c.mode && x.theme===c.theme && x.level===c.level && x.text===c.text);
  if (idx >= 0) ALL_CARDS.splice(idx, 1);
  state.index = 0;
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { $('nextBtn').click(); }
  if (e.key === 'ArrowLeft') { $('prevBtn').click(); }
});

// ── init ──
setTheme(state.theme);
render();
</script>
